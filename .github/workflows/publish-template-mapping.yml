name: Publish Template Mapping

# Publishes data-dictionary/template-mapping.md, the BNG Service template field
# mapping, to Confluence whenever it changes on main, as
# publish-data-dictionary.yml publishes the data dictionary. The `paths` filter
# makes the job run only when that file differs in the push, so an unchanged
# mapping never republishes.
on:
  push:
    branches:
      - main
    paths:
      - data-dictionary/template-mapping.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish template mapping to Confluence
    # Skipped, rather than failed, until the page exists and its ID is set.
    if: vars.CONFLUENCE_TEMPLATE_MAPPING_PAGE_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc

      # The publish script uses only Node built-ins plus the local converter
      # module, so no `npm ci` is needed.
      - name: Publish to Confluence
        env:
          CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
          CONFLUENCE_PAGE_ID: ${{ vars.CONFLUENCE_TEMPLATE_MAPPING_PAGE_ID }}
          CONFLUENCE_USER_EMAIL: ${{ secrets.CONFLUENCE_USER_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: node scripts/publish-confluence.mjs --source template-mapping
