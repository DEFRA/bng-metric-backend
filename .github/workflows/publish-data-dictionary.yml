name: Publish Data Dictionary

# Publishes data-dictionary/data-dictionary.md to Confluence whenever it changes
# on main. The `paths` filter makes the job run only when that file differs in
# the push (i.e. a PR that touched the data dictionary was merged), so an
# unchanged dictionary never republishes.
on:
  push:
    branches:
      - main
    paths:
      - data-dictionary/data-dictionary.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish data dictionary to Confluence
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      # The publish script uses only Node built-ins plus the local converter
      # module, so no `npm ci` is needed.
      - name: Publish to Confluence
        env:
          CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
          CONFLUENCE_PAGE_ID: ${{ vars.CONFLUENCE_DATA_DICTIONARY_PAGE_ID }}
          CONFLUENCE_USER_EMAIL: ${{ secrets.CONFLUENCE_USER_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: node scripts/publish-confluence.mjs
