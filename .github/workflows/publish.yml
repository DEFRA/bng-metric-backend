name: Publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '094954420758'

jobs:
  build:
    if: github.run_number != 1
    name: CDP-build-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # min-release-age (.npmrc) collides with the git-dependency prepare step
      # npm always runs for bng-library: it injects --before then rejects it
      # against min-release-age (npm/cli#9005). npm ci installs exact locked
      # versions, so the cooldown is redundant here — strip it for this step
      # only. It stays in .npmrc for npm install / local dev / Dependabot.
      - run: |
          sed -i '/^min-release-age=/d' .npmrc
          npm ci
          npm test

      - name: Build and Publish
        # Pinned, not @main. DEFRA/cdp-build-action#124 shipped an unbalanced
        # quote in the build-stage loop on 2026-09-04, and because @main is a
        # moving target every publish here began failing the moment it merged —
        # `unexpected EOF while looking for matching '"'`, a PARSE error, so it
        # fired whether or not we set build-secrets. Nothing in this repo
        # changed. 458fd8d is the commit our last green publish ran against.
        # Fix proposed upstream in DEFRA/cdp-build-action#128; move back to a
        # newer pin once it lands. Every other action here is SHA-pinned — this
        # one was the exception, and that is what let it break us.
        uses: DEFRA/cdp-build-action/build@458fd8d25ebbd1bde485b0ecf446a7977b533ebc # last green before #124
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
