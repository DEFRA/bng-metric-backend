name: Check Pull Request

on:
  schedule:
    - cron: '0 7 * * 1'
  pull_request:
    branches:
      - main
      - minimal
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  # Re-run the required checks when the merge queue tests a PR against the
  # latest main. Without this trigger the queue has no status to wait on and
  # nothing ever merges.
  merge_group:
    branches:
      - main

jobs:
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    env:
      LIQUIBASE_VERSION: '5.0.1'
      CDP_UPLOADER_IMAGE: 'defradigital/cdp-uploader:1.16.0@sha256:eb1627b60690ec24d41a17ed82e80c28d009aaaeb19dc179c6a3887da7e6a5bd'
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
    services:
      postgres:
        image: postgis/postgis:16-3.5@sha256:b33f597940e56d9388447c96214cf1b906f10a1c462149dcb79666b1acf012e7
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: bng_metric_backend
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7.2.3-alpine3.18@sha256:3ce533b2b057f74b235d1d8697ae08b1b6ff0a5e16827ea6a377b6365693c7ed
        ports:
          - 6379:6379
      localstack:
        image: localstack/localstack:3.0.2@sha256:e606c4421419030b12d63a59f1211f57f5b0fbf7e9ce769e6250ee62ff4f9293
        env:
          SERVICES: s3,sqs,sns,firehose
          DEBUG: '0'
          LS_LOG: WARN
          AWS_DEFAULT_REGION: eu-west-2
        ports:
          - 4566:4566
        options: >-
          --health-cmd="curl -fs http://localhost:4566/_localstack/health || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres to accept connections
        run: |
          for i in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -U dev -d bng_metric_backend; then
              echo "Postgres ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready within 60s"
          docker ps -a
          exit 1

      - name: Install Liquibase
        run: |
          mkdir -p ./liquibase-bin
          curl -sL "https://github.com/liquibase/liquibase/releases/download/v${LIQUIBASE_VERSION}/liquibase-${LIQUIBASE_VERSION}.tar.gz" | tar xz -C ./liquibase-bin
          ./liquibase-bin/liquibase lpm add postgresql --global

      - name: Apply Liquibase migrations
        run: |
          ./liquibase-bin/liquibase \
            --changelog-file=changelog/db.changelog.xml \
            --url=jdbc:postgresql://127.0.0.1:5432/bng_metric_backend \
            --username=dev \
            --password=dev \
            update

      - name: Seed LocalStack (buckets + SQS queues)
        run: bash compose/start-localstack.sh

      - name: Start cdp-uploader
        # Run as a step (not service) because it needs LocalStack buckets + queues
        # to exist first, which a service container cannot wait on. --network host
        # lets it reach localstack and redis on the runner's localhost.
        run: |
          docker pull "${CDP_UPLOADER_IMAGE}"
          docker run -d --name cdp-uploader --network host \
            -e PORT=7337 \
            -e NODE_ENV=development \
            -e REDIS_HOST=localhost \
            -e USE_SINGLE_INSTANCE_CACHE=true \
            -e MOCK_VIRUS_SCAN_ENABLED=true \
            -e MOCK_VIRUS_RESULT_DELAY=2 \
            -e SQS_ENDPOINT=http://localhost:4566 \
            -e S3_ENDPOINT=http://localhost:4566 \
            -e CONSUMER_BUCKETS=baseline-files \
            -e AWS_REGION=eu-west-2 \
            -e AWS_DEFAULT_REGION=eu-west-2 \
            -e AWS_ACCESS_KEY_ID=test \
            -e AWS_SECRET_ACCESS_KEY=test \
            "${CDP_UPLOADER_IMAGE}"

      - name: Wait for cdp-uploader
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:7337/health >/dev/null 2>&1; then
              echo "cdp-uploader ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "cdp-uploader did not become ready within 60s"
          docker logs cdp-uploader || true
          exit 1

      - name: Run integration tests with coverage + route gate
        env:
          SKIP_MIGRATIONS: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: dev
          DB_LOCAL_PASSWORD: dev
          DB_DATABASE: bng_metric_backend
          CDP_UPLOADER_URL: http://127.0.0.1:7337
          S3_ENDPOINT: http://127.0.0.1:4566
        run: npm run test:integration:full

      - name: Upload integration coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-coverage
          path: coverage/integration/
          if-no-files-found: warn

      - name: cdp-uploader logs (on failure)
        if: failure()
        run: docker logs cdp-uploader || true

  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          npm ci
          npm run format:check
          npm run lint
          npm test

      - name: Data dictionary is up to date
        run: |
          npm run data-dictionary
          git diff --exit-code -- data-dictionary/data-dictionary.md data-dictionary/data-dictionary.json

      - name: Security audit
        run: npm run security-audit

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-backend-template .
          exit $?

      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
