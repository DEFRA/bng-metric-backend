name: Check Pull Request

on:
  pull_request:
    branches:
      - main
      - minimal
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    env:
      LIQUIBASE_VERSION: '5.0.1'
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: bng_metric_backend
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres to accept connections
        run: |
          for i in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -U dev -d bng_metric_backend; then
              echo "Postgres ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready within 60s"
          docker ps -a
          exit 1

      - name: Install Liquibase
        run: |
          mkdir -p ./liquibase-bin
          curl -sL "https://github.com/liquibase/liquibase/releases/download/v${LIQUIBASE_VERSION}/liquibase-${LIQUIBASE_VERSION}.tar.gz" | tar xz -C ./liquibase-bin
          ./liquibase-bin/liquibase lpm add postgresql --global

      - name: Apply Liquibase migrations
        run: |
          ./liquibase-bin/liquibase \
            --changelog-file=changelog/db.changelog.xml \
            --url=jdbc:postgresql://127.0.0.1:5432/bng_metric_backend \
            --username=dev \
            --password=dev \
            update

      - name: Run integration tests
        env:
          SKIP_MIGRATIONS: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: dev
          DB_LOCAL_PASSWORD: dev
          DB_DATABASE: bng_metric_backend
        run: npm run test:integration

  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          npm ci
          npm run format:check
          npm run lint
          npm test

      - name: Security audit
        run: npm run security-audit

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-backend-template .
          exit $?

