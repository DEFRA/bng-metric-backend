# To set up Sonar cloud follow https://github.com/DEFRA/cdp-documentation/blob/main/howto/sonarcloud.md
# Update properties in this file as per the howto instructions
# Uncomment properties in this .github/workflows/check-pull-request.yml
# Uncomment properties in this .github/workflows/publish.yml
# Uncomment properties in this .github/workflows/publish-hotfix.yml

sonar.projectKey=DEFRA_bng-metric-backend
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/bng-metric-backend
sonar.links.ci=https://github.com/DEFRA/bng-metric-backend/actions
sonar.links.scm=https://github.com/DEFRA/bng-metric-backend
sonar.links.issue=https://github.com/DEFRA/bng-metric-backend/issues

sonar.sources=src/,bng-metric-engine/src/,scripts/
sonar.exclusions=src/**/*.test.js,bng-metric-engine/src/**/*.test.js
sonar.coverage.exclusions=scripts/**
sonar.tests=src/,bng-metric-engine/src/
sonar.test.inclusions=src/**/*.test.js,bng-metric-engine/src/**/*.test.js

sonar.javascript.lcov.reportPaths=./coverage/lcov.info

sonar.cpd.exclusions=src/**/*.test.js,bng-metric-engine/src/**/*.test.js

# Vitest is configured with globals: true (see vitest.config.js), so vi,
# describe, test, expect, beforeAll, afterAll, beforeEach, afterEach, suite,
# and it are injected at runtime in test files. SonarCloud's JS analyzer
# does not read project-level ESLint globals or accept a "globals" property
# in this file, so suppress javascript:S3827 ("variables should be defined
# before being used") on .test.js files via the multicriteria issue-ignore
# mechanism instead.
sonar.issue.ignore.multicriteria=vitestGlobals
sonar.issue.ignore.multicriteria.vitestGlobals.ruleKey=javascript:S3827
sonar.issue.ignore.multicriteria.vitestGlobals.resourceKey=**/*.test.js
